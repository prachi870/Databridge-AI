[project]
name = "sqlrouter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
  "pydantic>=2.4",
  "httpx>=0.25",
  "anthropic>=0.7",
  "openai>=1.3",
  "groq>=0.9",
]
dev = ["pytest>=7.4", "ruff>=0.1"]
ml = [
  "torch>=2.0",
  "transformers>=4.35",
  "peft>=0.7",
  "trl>=0.7",
  "bitsandbytes>=0.41",
  "accelerate>=0.24",
  "datasets>=2.14",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=13",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "wandb>=0.15",
]
gpu = ["vllm>=0.2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
